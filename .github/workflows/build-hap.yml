name: Build HarmonyOS HAP

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode: debug or release"
        required: true
        default: "debug"
  push:
    branches: [main]
    paths:
      - 'entry/**'
      - 'hvigor/**'
      - 'build-profile.json5'
      - 'oh-package.json5'
      - 'hvigorfile.ts'
      - '.github/workflows/build-hap.yml'

concurrency:
  group: hap-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: registry.cn-qingdao.aliyuncs.com/xuxiaoweicomcn/hmos-command:5.0.3.906
      env:
        LANG: C.UTF-8
        npm_config_auto_install_peers: "true"
        npm_config_shamefully_hoist: "true"
      options: --user root
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Fix checkout ownership
        run: chown -R root:root .

      - name: Configure registries
        run: |
          npm config set registry https://repo.huaweicloud.com/repository/npm/
          npm config set "@ohos:registry" https://repo.harmonyos.com/npm/
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          ohpm config set strict_ssl false

      - name: Configure pnpm
        run: |
          echo "auto-install-peers=true" >> "$HOME/.npmrc"
          echo "shamefully-hoist=true" >> "$HOME/.npmrc"
          echo "--- .npmrc contents ---"
          cat "$HOME/.npmrc"

      - name: Verify environment
        run: |
          echo "=== Environment Check ==="
          node -v
          hvigorw -v
          ohpm -v
          java -version 2>&1 | head -3
          echo "========================"

      - name: Install ohpm dependencies
        run: |
          echo "[INFO] Installing ohpm dependencies..."
          ohpm install --all

      - name: Clean hvigor cache
        run: |
          echo "[INFO] Cleaning hvigor project cache..."
          rm -rf /github/home/.hvigor/project_caches || true

      - name: List available hvigor tasks
        run: |
          echo "[INFO] Available hvigor tasks:"
          hvigorw tasks --no-daemon

      - name: Build HAP
        run: |
          BUILD_MODE="${{ github.event.inputs.build_mode || 'debug' }}"
          echo "[INFO] Building HAP in ${BUILD_MODE} mode..."
          hvigorw assembleHap \
            --mode module \
            -p product=default \
            -p buildMode=${BUILD_MODE} \
            --no-daemon

      - name: Find and collect HAP files
        run: |
          echo "[INFO] Searching for built .hap files..."
          HAP_FILES=$(find . -name '*.hap' -type f 2>/dev/null)
          if [ -z "$HAP_FILES" ]; then
            echo "[ERROR] No .hap files found!"
            find . -path '*/build/*' -type f | head -20
            exit 1
          fi
          echo "Found HAP files:"
          echo "$HAP_FILES"
          mkdir -p hap-output
          find . -name '*.hap' -type f -exec cp {} hap-output/ \;

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: md3music-harmonyos-hap
          path: hap-output/*.hap
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-hap
          name: MD3Music HarmonyOS HAP Build #${{ github.run_number }}
          files: hap-output/*.hap
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
