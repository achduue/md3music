name: Build HarmonyOS HAP

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode: debug or release"
        required: true
        default: "debug"
  push:
    branches: [main]
    paths:
      - 'entry/**'
      - 'hvigor/**'
      - 'scripts/**'
      - 'build-profile.json5'
      - 'oh-package.json5'
      - 'hvigorfile.ts'
      - '.github/workflows/build-hap.yml'

concurrency:
  group: hap-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: registry.cn-qingdao.aliyuncs.com/xuxiaoweicomcn/hmos-command:5.0.3.906
      env:
        LANG: C.UTF-8
        npm_config_auto_install_peers: "true"
        npm_config_shamefully_hoist: "true"
      options: --user root
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Fix checkout ownership
        run: chown -R root:root .

      - name: Configure registries
        run: |
          npm config set registry https://registry.npmmirror.com/
          npm config set "@ohos:registry" https://repo.harmonyos.com/npm/
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          ohpm config set strict_ssl false

      - name: Pre-install pnpm
        run: |
          echo "[INFO] Pre-installing pnpm to avoid hvigor wrapper network issues..."
          npm install -g pnpm@8.13.1
          pnpm -v

      - name: Configure pnpm
        run: |
          echo "auto-install-peers=true" >> "$HOME/.npmrc"
          echo "shamefully-hoist=true" >> "$HOME/.npmrc"

      - name: Verify environment
        run: |
          echo "=== Environment Check ==="
          node -v
          hvigorw -v
          ohpm -v
          java -version 2>&1 | head -3
          echo "========================"

      - name: Install ohpm dependencies
        run: |
          echo "[INFO] Installing ohpm dependencies..."
          ohpm install --all

      - name: Clean hvigor cache
        run: |
          echo "[INFO] Cleaning hvigor project cache..."
          rm -rf /github/home/.hvigor/project_caches || true

      - name: Generate signing materials
        run: |
          chmod +x scripts/generate-signing-materials.sh
          bash scripts/generate-signing-materials.sh

      - name: Configure signing in build-profile
        run: |
          cat > build-profile.json5 << 'BPEOF'
          {
            "app": {
              "signingConfigs": [
                {
                  "name": "default",
                  "type": "HarmonyOS",
                  "material": {
                    "certpath": "signing/md3music.pem",
                    "storePassword": "md3music_signing_password_20240101",
                    "keyAlias": "md3music-key",
                    "keyPassword": "md3music_signing_password_20240101",
                    "profile": "signing/md3music.p7b",
                    "signAlg": "SHA256withECDSA",
                    "storeFile": "signing/md3music.p12"
                  }
                }
              ],
              "products": [
                {
                  "name": "default",
                  "signingConfig": "default",
                  "compatibleSdkVersion": "5.0.0(12)",
                  "runtimeOS": "HarmonyOS"
                }
              ],
              "buildModeSet": [
                { "name": "debug" },
                { "name": "release" }
              ]
            },
            "modules": [
              {
                "name": "entry",
                "srcPath": "./entry",
                "targets": [
                  {
                    "name": "default",
                    "applyToProducts": ["default"]
                  }
                ]
              }
            ]
          }
          BPEOF
          echo "[INFO] Updated build-profile.json5 with signing config"
          cat build-profile.json5

      - name: Build signed HAP
        run: |
          BUILD_MODE="${{ github.event.inputs.build_mode || 'debug' }}"
          echo "[INFO] Building signed HAP in ${BUILD_MODE} mode..."
          hvigorw assembleHap \
            -p product=default \
            -p buildMode=${BUILD_MODE} \
            --no-daemon

      - name: Find and collect HAP
        run: |
          echo "[INFO] Searching for .hap files..."
          find . -name '*.hap' -type f
          HAP_FILE=$(find . -name '*.hap' -type f | head -1)
          if [ -z "$HAP_FILE" ]; then
            echo "[ERROR] No .hap files found!"
            exit 1
          fi
          echo "Found HAP: $HAP_FILE"
          mkdir -p hap-output
          cp "$HAP_FILE" hap-output/md3music-signed.hap

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: md3music-harmonyos-hap
          path: hap-output/*.hap
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-hap
          name: MD3Music HarmonyOS HAP Build #${{ github.run_number }}
          files: hap-output/*.hap
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
