name: Build HAP

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup HarmonyOS SDK
        run: |
          echo "Setting up HarmonyOS SDK..."
          # This step would typically download and configure the HarmonyOS SDK
          # For now, we assume the SDK is available in the runner
          echo "SDK_HOME=/opt/harmonyos/sdk" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          npm install -g @ohos/hvigor
          hvigor --version

      - name: Build unsigned HAP
        run: |
          hvigor assembleHap --mode debug --no-daemon
          echo "Build completed. Locating unsigned HAP..."
          find . -name "*.hap" -type f | head -5

      - name: Generate signing materials
        run: |
          chmod +x scripts/generate-signing-materials.sh
          bash scripts/generate-signing-materials.sh

      - name: Sign HAP
        run: |
          SIGN_TOOL=$(find / -name "hap-sign-tool.jar" 2>/dev/null | head -1)
          if [ -z "$SIGN_TOOL" ]; then
            echo "ERROR: hap-sign-tool.jar not found"
            exit 1
          fi
          KEY_PWD="md3music_signing_password_20240101"
          UNSIGNED_HAP=$(find . -name "*.hap" -type f | head -1)
          if [ -z "$UNSIGNED_HAP" ]; then
            echo "ERROR: No unsigned HAP found"
            exit 1
          fi
          echo "Signing: $UNSIGNED_HAP"
          java -jar "$SIGN_TOOL" sign-app \
            -keyAlias "md3music-key" \
            -keyAlg "ECC" \
            -signAlg "SHA256withECDSA" \
            -mode "localSign" \
            -profileCertFile "signing/md3music-profile.pem" \
            -inFile "$UNSIGNED_HAP" \
            -keystoreFile "signing/md3music.p12" \
            -outFile "signed-output/app-signed.hap" \
            -keyPwd "$KEY_PWD" \
            -keystorePwd "$KEY_PWD" \
            -appCertFile "signing/md3music.cer" \
            -profileFile "signing/md3music.p7b"

      - name: Upload signed HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: md3music-signed-hap
          path: signed-output/app-signed.hap
          if-no-files-found: error

      - name: Create Release
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "MD3Music v${{ github.run_number }}"
          body: |
            ## MD3Music Release v${{ github.run_number }}
            
            Auto-built from main branch.
            
            ### Changes
            - See commits for details.
          files: |
            signed-output/app-signed.hap
          generate_release_notes: true