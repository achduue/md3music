name: Build HarmonyOS HAP

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode: debug or release"
        required: true
        default: "debug"
  push:
    branches: [main]
    paths:
      - 'entry/**'
      - 'hvigor/**'
      - 'scripts/**'
      - 'build-profile.json5'
      - 'oh-package.json5'
      - 'hvigorfile.ts'
      - '.github/workflows/build-hap.yml'

concurrency:
  group: hap-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: registry.cn-qingdao.aliyuncs.com/xuxiaoweicomcn/hmos-command:5.0.3.906
      env:
        LANG: C.UTF-8
        npm_config_auto_install_peers: "true"
        npm_config_shamefully_hoist: "true"
      options: --user root
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Fix checkout ownership
        run: chown -R root:root .

      - name: Configure registries
        run: |
          npm config set registry https://registry.npmmirror.com/
          npm config set "@ohos:registry" https://repo.harmonyos.com/npm/
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          ohpm config set strict_ssl false

      - name: Pre-install pnpm
        run: |
          echo "[INFO] Pre-installing pnpm to avoid hvigor wrapper network issues..."
          npm install -g pnpm@8.13.1
          pnpm -v

      - name: Configure pnpm
        run: |
          echo "auto-install-peers=true" >> "$HOME/.npmrc"
          echo "shamefully-hoist=true" >> "$HOME/.npmrc"

      - name: Verify environment
        run: |
          echo "=== Environment Check ==="
          node -v
          hvigorw -v
          ohpm -v
          java -version 2>&1 | head -3
          echo "========================"

      - name: Install ohpm dependencies
        run: |
          echo "[INFO] Installing ohpm dependencies..."
          ohpm install --all

      - name: Clean hvigor cache
        run: |
          echo "[INFO] Cleaning hvigor project cache..."
          rm -rf /github/home/.hvigor/project_caches || true

      - name: Build unsigned HAP
        run: |
          BUILD_MODE="${{ github.event.inputs.build_mode || 'debug' }}"
          echo "[INFO] Building unsigned HAP in ${BUILD_MODE} mode..."
          hvigorw assembleHap \
            --mode module \
            -p product=default \
            -p buildMode=${BUILD_MODE} \
            --no-daemon

      - name: Generate signing materials
        run: |
          chmod +x scripts/generate-signing-materials.sh
          bash scripts/generate-signing-materials.sh

      - name: Sign HAP
        run: |
          SIGN_TOOL=$(find / -name "hap-sign-tool.jar" 2>/dev/null | head -1)
          UNSIGNED_HAP=$(find . -name '*-unsigned.hap' -type f | head -1)
          echo "Signing: $UNSIGNED_HAP"
          java -jar "$SIGN_TOOL" sign-app \
            -keyAlias "md3music-key" \
            -signAlg "SHA256withECDSA" \
            -mode "localSign" \
            -appCertFile "signing/md3music.pem" \
            -profileFile "signing/md3music.p7b" \
            -inFile "$UNSIGNED_HAP" \
            -keystoreFile "signing/md3music.p12" \
            -outFile "md3music-signed.hap" \
            -keyPwd "md3music_signing_password_20240101" \
            -keystorePwd "md3music_signing_password_20240101"

      - name: Find and collect signed HAP
        run: |
          echo "[INFO] Searching for signed .hap files..."
          SIGNED_HAP=$(find . -name '*-signed.hap' -type f 2>/dev/null | head -1)
          if [ -z "$SIGNED_HAP" ]; then
            echo "[ERROR] No signed .hap files found!"
            find . -name '*.hap' -type f
            exit 1
          fi
          echo "Found signed HAP: $SIGNED_HAP"
          mkdir -p hap-output
          cp "$SIGNED_HAP" hap-output/

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: md3music-harmonyos-hap
          path: hap-output/*.hap
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-hap
          name: MD3Music HarmonyOS HAP Build #${{ github.run_number }}
          files: hap-output/*.hap
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
